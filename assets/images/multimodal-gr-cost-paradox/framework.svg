<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MQL4GRec、MACRec、SynGR 的技术脉络与工程取舍</title>
  <desc id="desc">从统一量化语言，到跨模态量化对齐，再到协同语义建模，同时展示双 SID、多任务训练、双路推理和多视图正则带来的工程成本。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #dbe3ec; stroke-width: 1.4; filter: url(#softShadow); }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #475569; }
      .paper { font: 800 30px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #0f172a; }
      .venue { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #64748b; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
      .body { font: 500 15.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #334155; }
      .cost { font: 700 15.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #7f1d1d; }
      .axis { stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .thin { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 6 7; }
      .chip { fill: #eef2ff; stroke: #c7d2fe; }
      .chip2 { fill: #ecfdf5; stroke: #bbf7d0; }
      .chip3 { fill: #fff7ed; stroke: #fed7aa; }
      .chip4 { fill: #fef2f2; stroke: #fecaca; }
      .num { font: 800 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="64" y="66">多模态生成式推荐：技术演化与工程取舍</text>
  <text class="subtitle" x="64" y="100">统一语言 → 量化阶段对齐 → 协同语义；表达能力增强的同时，训练与推理成本持续堆叠。</text>

  <line class="axis" x1="92" y1="615" x2="1192" y2="615"/>
  <text class="subtitle" x="980" y="652">技术焦点向右推进</text>
  <line class="axis" x1="92" y1="615" x2="92" y2="165"/>
  <text class="subtitle" transform="translate(45 452) rotate(-90)">系统成本向上堆叠</text>
  <line class="thin" x1="118" y1="455" x2="1170" y2="455"/>
  <line class="thin" x1="118" y1="315" x2="1170" y2="315"/>

  <g transform="translate(132 200)">
    <rect class="panel" width="332" height="338" rx="18"/>
    <circle cx="32" cy="34" r="16" fill="#2563eb"/>
    <text class="num" x="26" y="40">1</text>
    <text class="paper" x="62" y="42">MQL4GRec</text>
    <text class="venue" x="62" y="70">ICLR 2025</text>
    <rect class="chip" x="28" y="98" width="276" height="40" rx="20"/>
    <text class="label" x="48" y="124">统一 quantitative language</text>
    <text class="body" x="32" y="170">文本 RQ-VAE 与图像 RQ-VAE</text>
    <text class="body" x="32" y="198">生成两套模态 SID，共享词表</text>
    <text class="body" x="32" y="226">NIG / AIG / QLA 多任务生成</text>
    <text class="body" x="32" y="254">文本、图像两路 beam search</text>
    <text class="cost" x="32" y="302">成本起点：双 SID + 多任务</text>
    <text class="cost" x="32" y="326">双路推理与融合</text>
  </g>

  <path d="M480 360 C500 350, 512 350, 532 360" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <g transform="translate(500 150)">
    <rect class="panel" width="334" height="392" rx="18"/>
    <circle cx="32" cy="34" r="16" fill="#059669"/>
    <text class="num" x="26" y="40">2</text>
    <text class="paper" x="62" y="42">MACRec</text>
    <text class="venue" x="62" y="70">AAAI 2026</text>
    <rect class="chip2" x="28" y="98" width="278" height="40" rx="20"/>
    <text class="label" x="50" y="124">跨模态量化对齐</text>
    <text class="body" x="32" y="170">文本/视觉 K-means 伪标签</text>
    <text class="body" x="32" y="198">逐层 residual contrastive</text>
    <text class="body" x="32" y="224">learning，减少 semantic loss</text>
    <text class="body" x="32" y="252">量化表示 reconstruction</text>
    <text class="body" x="32" y="278">alignment</text>
    <text class="body" x="32" y="306">T5 latent + explicit generation</text>
    <text class="cost" x="32" y="350">成本继续上升：离线 tokenizer</text>
    <text class="cost" x="32" y="374">与对齐训练更重</text>
  </g>

  <path d="M850 340 C874 320, 886 320, 910 340" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrow)"/>

  <g transform="translate(868 108)">
    <rect class="panel" width="338" height="446" rx="18"/>
    <circle cx="32" cy="34" r="16" fill="#f97316"/>
    <text class="num" x="26" y="40">3</text>
    <text class="paper" x="62" y="42">SynGR</text>
    <text class="venue" x="62" y="70">ICML 2026</text>
    <rect class="chip3" x="28" y="98" width="282" height="40" rx="20"/>
    <text class="label" x="62" y="124">从 alignment 到 synergy</text>
    <text class="body" x="32" y="170">PID 区分冗余、独有与协同</text>
    <text class="body" x="32" y="198">attention saliency 识别</text>
    <text class="body" x="32" y="224">dominant modality</text>
    <text class="body" x="32" y="252">mask 主导模态 top-r token</text>
    <text class="body" x="32" y="280">original/masked/unimodal 三视图</text>
    <text class="body" x="32" y="308">协同对比学习抑制捷径</text>
    <text class="cost" x="32" y="352">相对 MACRec 更省</text>
    <text class="cost" x="32" y="376">但仍非单 SID 路线</text>
    <rect class="chip4" x="28" y="404" width="282" height="36" rx="18"/>
    <text class="cost" x="78" y="428">效果提升 vs 成本收益</text>
  </g>

  <g transform="translate(184 585)">
    <text class="body" x="0" y="0">统一语言</text>
  </g>
  <g transform="translate(590 585)">
    <text class="body" x="0" y="0">更高质量 SID</text>
  </g>
  <g transform="translate(998 585)">
    <text class="body" x="0" y="0">真实协同语义</text>
  </g>
</svg>
