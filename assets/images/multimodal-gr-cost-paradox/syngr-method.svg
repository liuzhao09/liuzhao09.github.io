<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">SynGR 方法框架</title>
  <desc id="desc">SynGR 通过注意力显著性识别主导模态，遮蔽高显著 token，并使用原始、多模态遮蔽和单模态三视图做协同对比学习。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:800 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}
      .sub{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.blue{fill:#eff6ff;stroke:#bfdbfe}.green{fill:#ecfdf5;stroke:#bbf7d0}.orange{fill:#fff7ed;stroke:#fed7aa}.red{fill:#fef2f2;stroke:#fecaca}.purple{fill:#f5f3ff;stroke:#ddd6fe}
      .head{font:800 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#111827}
      .txt{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}
      .token{font:800 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1d4ed8}
      .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke:#f97316;stroke-width:2;stroke-dasharray:7 8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="64" y="62">SynGR：从跨模态对齐推进到协同语义学习</text>
  <text class="sub" x="64" y="96">核心是打断 dominant modality 的捷径，让 masked view 接近原始多模态表示、远离单模态 shortcut。</text>

  <rect class="box" x="55" y="142" width="260" height="410" rx="16"/>
  <text class="head" x="86" y="182">1. 多模态历史 token</text>
  <rect class="blue" x="86" y="225" width="198" height="72" rx="14"/>
  <text class="txt" x="116" y="255">文本 token</text>
  <text class="token" x="105" y="280">t1 t2 t3 t4</text>
  <rect class="green" x="86" y="338" width="198" height="72" rx="14"/>
  <text class="txt" x="116" y="368">视觉 token</text>
  <text class="token" x="105" y="393">v1 v2 v3 v4</text>
  <text class="small" x="86" y="468">两种模态都进入生成模型，但文本常形成优化捷径。</text>

  <path class="arrow" d="M315 345 H395"/>

  <rect class="box" x="395" y="112" width="310" height="470" rx="16"/>
  <text class="head" x="427" y="152">2. Saliency-aware masking</text>
  <rect class="purple" x="430" y="190" width="236" height="78" rx="14"/>
  <text class="txt" x="456" y="220">Encoder attention map</text>
  <text class="small" x="456" y="243">最后一层 self-attention</text>
  <rect class="orange" x="430" y="305" width="236" height="78" rx="14"/>
  <text class="txt" x="456" y="335">计算 token saliency</text>
  <text class="small" x="456" y="358">按 head 与 query 汇总 attention mass</text>
  <rect class="red" x="430" y="420" width="236" height="78" rx="14"/>
  <text class="txt" x="456" y="450">Mask dominant modality</text>
  <text class="small" x="456" y="473">遮蔽 top-r 高显著 token</text>
  <path class="dash" d="M548 268 V305"/>
  <path class="dash" d="M548 383 V420"/>

  <path class="arrow" d="M705 345 H780"/>

  <rect class="box" x="780" y="112" width="430" height="470" rx="16"/>
  <text class="head" x="812" y="152">3. Synergistic contrastive learning</text>
  <rect class="green" x="814" y="190" width="355" height="70" rx="14"/>
  <text class="txt" x="846" y="220">Positive: H_ori → Z_ori</text>
  <text class="small" x="848" y="243">原始多模态序列，保留完整联合语义</text>
  <rect class="orange" x="814" y="300" width="355" height="70" rx="14"/>
  <text class="txt" x="846" y="330">Anchor: H_mask → Z_mask</text>
  <text class="small" x="848" y="353">主导模态关键信息被遮蔽</text>
  <rect class="red" x="814" y="410" width="355" height="70" rx="14"/>
  <text class="txt" x="846" y="440">Negative: H_uni → Z_uni</text>
  <text class="small" x="848" y="463">单模态 shortcut 表示</text>
  <text class="txt" x="832" y="532">目标：Z_mask 靠近 Z_ori，远离 Z_uni</text>
  <text class="small" x="832" y="556">让模型从剩余多模态上下文中恢复协同语义。</text>
</svg>
