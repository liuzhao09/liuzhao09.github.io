<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MACRec 方法框架</title>
  <desc id="desc">MACRec 在 RQ-VAE 量化阶段引入跨模态伪标签和逐层对比学习，并在生成模型中加入隐式与显式对齐。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:800 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}
      .sub{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.blue{fill:#eff6ff;stroke:#bfdbfe}.green{fill:#ecfdf5;stroke:#bbf7d0}.purple{fill:#f5f3ff;stroke:#ddd6fe}.orange{fill:#fff7ed;stroke:#fed7aa}.red{fill:#fef2f2;stroke:#fecaca}
      .head{font:800 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#111827}
      .txt{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}
      .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke:#7c3aed;stroke-width:2;stroke-dasharray:7 8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="64" y="62">MACRec：把跨模态交互前移到 semantic ID 学习阶段</text>
  <text class="sub" x="64" y="96">核心不是简单 late fusion，而是在每层 residual quantization 中让文本与视觉互相校正。</text>

  <rect class="box" x="54" y="145" width="252" height="400" rx="16"/>
  <text class="head" x="84" y="185">1. 双模态 embedding</text>
  <rect class="blue" x="84" y="225" width="190" height="70" rx="14"/>
  <text class="txt" x="118" y="256">Text embedding</text>
  <text class="small" x="116" y="278">LLaMA encoder</text>
  <rect class="green" x="84" y="340" width="190" height="70" rx="14"/>
  <text class="txt" x="114" y="371">Vision embedding</text>
  <text class="small" x="120" y="393">ViT-L/14</text>
  <text class="small" x="84" y="470">文本偏品牌，视觉偏品类；二者互补但噪声形态不同。</text>

  <path class="arrow" d="M306 260 H382"/>
  <path class="arrow" d="M306 375 H382"/>

  <rect class="box" x="382" y="120" width="330" height="450" rx="16"/>
  <text class="head" x="414" y="160">2. Cross-modal quantization</text>
  <rect class="purple" x="418" y="195" width="258" height="70" rx="14"/>
  <text class="txt" x="452" y="225">K-means 伪标签</text>
  <text class="small" x="444" y="248">C_text 与 C_vision 互为监督</text>
  <rect class="blue" x="418" y="302" width="258" height="78" rx="14"/>
  <text class="txt" x="442" y="333">文本 residual 空间</text>
  <text class="small" x="442" y="356">用视觉伪标签定义正样本</text>
  <rect class="green" x="418" y="414" width="258" height="78" rx="14"/>
  <text class="txt" x="442" y="445">视觉 residual 空间</text>
  <text class="small" x="442" y="468">用文本伪标签定义正样本</text>
  <text class="small" x="418" y="532">逐层 InfoNCE 减少 semantic loss 和 codebook 偏置。</text>

  <path class="dash" d="M547 265 V302"/>
  <path class="dash" d="M547 380 V414"/>
  <path class="arrow" d="M712 345 H792"/>

  <rect class="box" x="792" y="120" width="420" height="450" rx="16"/>
  <text class="head" x="824" y="160">3. Multi-aspect alignment</text>
  <rect class="orange" x="826" y="198" width="350" height="72" rx="14"/>
  <text class="txt" x="856" y="228">Cross-modal reconstruction alignment</text>
  <text class="small" x="858" y="251">量化后的 text / visual 表示靠近</text>
  <rect class="orange" x="826" y="308" width="350" height="72" rx="14"/>
  <text class="txt" x="856" y="338">Implicit alignment in T5 latent space</text>
  <text class="small" x="858" y="361">同一 item 的两套 SID 表示互相拉近</text>
  <rect class="orange" x="826" y="418" width="350" height="72" rx="14"/>
  <text class="txt" x="856" y="448">Explicit token generation alignment</text>
  <text class="small" x="858" y="471">text SID ↔ visual SID 互生成</text>
  <rect class="red" x="826" y="515" width="350" height="34" rx="17"/>
  <text class="small" x="868" y="538">收益：SID collision 降低，codebook 使用更均衡；代价：离线训练更重。</text>
</svg>
