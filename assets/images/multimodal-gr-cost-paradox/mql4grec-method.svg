<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MQL4GRec 方法框架</title>
  <desc id="desc">MQL4GRec 将文本和图像内容分别编码并量化为 quantitative language，使用 NIG、AIG、QLA 多任务训练，推理时双路生成并融合候选。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.title{font:800 34px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#0f172a}
      .sub{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.blue{fill:#eff6ff;stroke:#bfdbfe}.green{fill:#ecfdf5;stroke:#bbf7d0}.orange{fill:#fff7ed;stroke:#fed7aa}.red{fill:#fef2f2;stroke:#fecaca}
      .head{font:800 22px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#111827}
      .txt{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#334155}
      .small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#475569}
      .token{font:700 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1d4ed8}
      .arrow{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:6 8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="64" y="62">MQL4GRec：多模态 quantitative language 生成推荐</text>
  <text class="sub" x="64" y="96">核心是先把文本和图像 item 内容翻译成两套短 token，再用多任务 Seq2Seq 学推荐与跨模态迁移。</text>

  <rect class="box" x="60" y="150" width="270" height="410" rx="16"/>
  <text class="head" x="92" y="190">1. Item 内容输入</text>
  <rect class="blue" x="92" y="225" width="205" height="70" rx="14"/>
  <text class="txt" x="120" y="255">文本描述 / 标题</text>
  <text class="small" x="122" y="278">LLaMA text encoder</text>
  <rect class="green" x="92" y="335" width="205" height="70" rx="14"/>
  <text class="txt" x="122" y="365">商品图像</text>
  <text class="small" x="124" y="388">ViT visual encoder</text>
  <text class="small" x="92" y="472">冻结模态 encoder 先把内容变成连续 embedding。</text>

  <path class="arrow" d="M330 260 H410"/>
  <path class="arrow" d="M330 370 H410"/>

  <rect class="box" x="410" y="150" width="310" height="410" rx="16"/>
  <text class="head" x="442" y="190">2. Quantitative translator</text>
  <rect class="blue" x="445" y="220" width="235" height="88" rx="14"/>
  <text class="txt" x="478" y="252">文本 RQ-VAE</text>
  <text class="token" x="468" y="282">&lt;a2&gt;&lt;b3&gt;&lt;c1&gt;&lt;d6&gt;</text>
  <rect class="green" x="445" y="342" width="235" height="88" rx="14"/>
  <text class="txt" x="478" y="374">图像 RQ-VAE</text>
  <text class="token" x="468" y="404">&lt;A1&gt;&lt;B4&gt;&lt;C2&gt;&lt;D6&gt;</text>
  <text class="small" x="445" y="478">小写 / 大写 codeword 区分模态，共享推荐词表。</text>

  <path class="arrow" d="M720 310 H790"/>

  <rect class="box" x="790" y="112" width="400" height="488" rx="16"/>
  <text class="head" x="822" y="152">3. QLG 多任务生成训练</text>
  <rect class="orange" x="822" y="185" width="330" height="70" rx="14"/>
  <text class="txt" x="852" y="215">NIG：历史 SID → 下一个 SID</text>
  <text class="small" x="854" y="238">主推荐任务，分别有 text / visual 子任务</text>
  <rect class="orange" x="822" y="282" width="330" height="70" rx="14"/>
  <text class="txt" x="852" y="312">AIG：一种模态历史 → 另一模态目标</text>
  <text class="small" x="854" y="335">学习跨模态偏好迁移</text>
  <rect class="orange" x="822" y="379" width="330" height="70" rx="14"/>
  <text class="txt" x="852" y="409">QLA：同一 item 的 text / visual ID 对齐</text>
  <text class="small" x="854" y="432">item-level token translation</text>
  <rect class="red" x="822" y="488" width="330" height="76" rx="14"/>
  <text class="txt" x="852" y="520">推理：两路 beam search + reranking</text>
  <text class="small" x="854" y="544">同时出现在两路列表的 item 额外加分</text>

  <path class="dash" d="M565 560 C620 650, 970 650, 970 575"/>
  <text class="small" x="394" y="633">代价：双 SID、三类任务、双路候选生成和融合规则从起点就进入系统。</text>
</svg>
